<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>アイアンレコーダー Pro</title>
    <!-- PWA manifest -->
    <link rel="manifest" href="data:application/manifest+json,{name:'IronRecorder Pro',short_name:'IR Pro',display:'standalone',theme_color:'#000000',background_color:'#000000',icons:[{src:'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Ccircle cx=\'50\' cy=\'50\' r=\'45\' fill=\'%23ff4444\'/%3E%3C/svg%3E',sizes:'512x512',type:'image/svg+xml'}]}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- MP3 エンコード用 lamejs (外部ライブラリ) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
    <!-- Google Identity Services (Google Drive サインイン用) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0c1114;
            color: #b0b8c0;
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        #app {
            width: 100%;
            max-width: 560px;
            background: #181e24;
            border-radius: 24px;
            padding: 20px 16px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.5);
            border: 1px solid #2a343c;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-align: center;
            color: #c76b6b;
            margin-bottom: 16px;
            text-shadow: 0 0 6px #c76b6b40;
        }

        .meter-container {
            background: #12181e;
            border-radius: 16px;
            padding: 14px 12px;
            margin-bottom: 20px;
            border: 1px solid #2f3a42;
        }

        .meter-bar {
            height: 24px;
            background: #1b242b;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: inset 0 2px 4px #00000060;
        }

        #meterFill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #5f9f7f, #7fc07f);
            box-shadow: 0 0 8px #7fc07f80;
            transition: width 0.05s linear;
            border-radius: 12px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 400;
            background: #00000020;
            padding: 6px 14px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
        }

        .time-box, .size-box {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .label {
            font-size: 0.8rem;
            color: #7e8c9c;
        }

        .value {
            font-family: 'Courier New', monospace;
            color: #cbd5e0;
            text-shadow: 0 0 4px #8aa0b0;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0 12px;
        }

        .btn {
            background: #2e3b44;
            border: none;
            border-radius: 40px;
            padding: 14px 18px;
            font-size: 1.3rem;
            font-weight: 500;
            color: #d3dce5;
            box-shadow: 0 4px 0 #151c22, 0 2px 8px black;
            cursor: pointer;
            transition: all 0.05s ease;
            border: 1px solid #4a5a66;
            flex: 1;
            text-align: center;
            min-width: 90px;
            touch-action: manipulation;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #151c22, 0 1px 6px black;
        }

        .btn.primary {
            background: #a04a4a;
            border-color: #b87c7c;
            box-shadow: 0 4px 0 #5e2e2e;
            color: #f0e0e0;
        }

        .btn.secondary {
            background: #3a4650;
            flex: 0.5;
            font-size: 1.1rem;
            padding: 14px 8px;
        }

        .btn:disabled {
            opacity: 0.35;
            transform: none;
            box-shadow: 0 2px 0 #151c22;
            pointer-events: none;
            filter: grayscale(0.5);
        }

        #relockBtn {
            background: #33404a;
            border-color: #54626e;
            box-shadow: 0 3px 0 #1e262c;
            font-size: 1rem;
            padding: 10px 8px;
            flex: 0.4;
        }

        .recovery-area {
            margin-top: 20px;
            padding: 14px 12px;
            background: #111a21;
            border-radius: 16px;
            border-left: 4px solid #a08060;
        }

        .recovery-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            margin-bottom: 10px;
            color: #b89a7a;
        }

        .recovery-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        #recoverBtn, #downloadWebmBtn {
            background: #4a4038;
            padding: 12px 12px;
            font-size: 1rem;
            box-shadow: 0 3px 0 #2f2822;
            border-color: #7a6a5c;
        }

        #downloadWebmBtn {
            background: #3a454e;
            border-color: #607080;
        }

        .status-text {
            font-size: 0.75rem;
            color: #7a8a94;
            margin-top: 8px;
        }

        /* Google Drive エリア */
        .drive-area {
            margin-top: 16px;
            padding: 14px 12px;
            background: #101a24;
            border-radius: 16px;
            border-left: 4px solid #4a7fb0;
        }

        .drive-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            margin-bottom: 10px;
            color: #8ab0d0;
        }

        #driveStatus {
            margin-left: auto;
            background: #1a2a38;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        #driveStatus.connected { background: #22402a; color: #8fd0a0; }

        .drive-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        #driveSignInBtn, #driveUploadBtn {
            background: #2c4257;
            padding: 12px 12px;
            font-size: 1rem;
            box-shadow: 0 3px 0 #1a2833;
            border-color: #4a7098;
        }

        #driveUploadBtn {
            background: #2f4a56;
            border-color: #5090a8;
        }

        .drive-auto {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 0.8rem;
            color: #8a9aa8;
            user-select: none;
            cursor: pointer;
        }

        .drive-auto input { width: 16px; height: 16px; cursor: pointer; }

        .footnote {
            margin-top: 12px;
            color: #5f707c;
            font-size: 0.7rem;
            text-align: center;
        }

        /* アイアンスクリーン */
        #ironOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 9999;
            display: block;
            touch-action: none;
            pointer-events: auto;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s;
            user-select: none;
        }

        #ironOverlay.active {
            opacity: 1;
            visibility: visible;
        }

        @media (max-width: 480px) {
            #app { padding: 16px 10px; }
            .btn { padding: 12px 10px; font-size: 1.1rem; }
            .btn.secondary { font-size: 1rem; }
            #relockBtn { font-size: 0.9rem; padding: 10px 4px; }
        }
    </style>
</head>
<body>
<div id="app">
    <h1>◉ IRON REC</h1>

    <div class="meter-container">
        <div class="meter-bar">
            <div id="meterFill"></div>
        </div>
        <div class="stats">
            <div class="time-box">
                <span class="label">経過</span>
                <span id="timerDisplay" class="value">00:00</span>
            </div>
            <div class="size-box">
                <span class="label">保存済</span>
                <span id="sizeDisplay" class="value">0 KB</span>
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="recordBtn" class="btn primary">▶ 録音</button>
        <button id="stopBtn" class="btn secondary" disabled>■ 停止</button>
        <button id="relockBtn" class="btn" disabled title="鉄壁を再表示">🔒 再ロック</button>
    </div>

    <div class="recovery-area">
        <div class="recovery-title">
            <span>🛡️ 保護データ</span>
            <span id="recoveryBadge" style="margin-left:auto; background:#332a22; padding:4px 12px; border-radius:20px; font-size:0.8rem;">待機中</span>
        </div>
        <div class="recovery-buttons">
            <button id="recoverBtn" class="btn" disabled>📦 中断MP3復元</button>
            <button id="downloadWebmBtn" class="btn" disabled>⬇ WebM保存</button>
        </div>
        <div id="convertStatus" class="status-text">5秒ごとに自動保存・停止時にMP3変換</div>
    </div>

    <div class="drive-area">
        <div class="drive-title">
            <span>☁️ Google Drive</span>
            <span id="driveStatus">未接続</span>
        </div>
        <div class="drive-buttons">
            <button id="driveSignInBtn" class="btn">🔑 サインイン</button>
            <button id="driveUploadBtn" class="btn" disabled>☁️ Driveへ保存</button>
        </div>
        <label class="drive-auto">
            <input type="checkbox" id="driveAutoUpload">
            録音停止時にMP3を自動でDriveへ保存
        </label>
        <div id="driveMsg" class="status-text">録音したMP3をGoogle Driveに保存できます</div>
    </div>

    <div class="footnote">
        WakeLock有効 | 長押し3秒でロック解除 (タッチ/マウス)
    </div>
</div>

<div id="ironOverlay"></div>

<script>
    (function(){
        "use strict";

        // ==================================================================
        // Google Drive 設定
        // ------------------------------------------------------------------
        // 【事前準備】Google Cloud Console (https://console.cloud.google.com/)
        //   1. プロジェクトを作成
        //   2. 「APIとサービス」→「ライブラリ」から Google Drive API を有効化
        //   3. 「OAuth 同意画面」を設定（テストユーザーに自分のアカウントを追加）
        //   4. 「認証情報」→「OAuth 2.0 クライアント ID」を作成
        //        - アプリケーションの種類: 「ウェブアプリケーション」
        //        - 承認済みの JavaScript 生成元: このページを公開するオリジンを追加
        //          例) https://<ユーザー名>.github.io  （ローカルなら http://localhost:8080 など）
        //   5. 発行された「クライアント ID」を下の GOOGLE_CLIENT_ID に貼り付け
        //        （空のままでも、初回サインイン時に入力を求められブラウザに保存されます）
        //
        // ※ Drive へのアクセス範囲は drive.file スコープ（このアプリが作成した
        //    ファイルのみ）に限定しているため、既存の Drive 内ファイルは読めません。
        // ==================================================================
        let GOOGLE_CLIENT_ID = '';  // 例: '1234567890-abcdef.apps.googleusercontent.com'
        const GOOGLE_DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';

        let tokenClient = null;     // GIS トークンクライアント
        let accessToken = null;     // 取得済みアクセストークン
        let pendingUpload = null;   // サインイン完了後に自動実行するアップロード {blob, name}
        let lastMp3Blob = null;     // 直近に生成した MP3（Drive アップロード対象）
        let lastMp3Name = null;

        // -------------------- グローバル変数 --------------------
        let mediaRecorder = null;
        let audioStream = null;
        let wakeLock = null;
        let recordingStartTime = 0;
        let updateInterval = null;
        let db = null;
        let isRecording = false;
        let totalSavedBytes = 0;
        let currentSessionId = null;
        let finalWebMBlob = null;  // 停止時に結合したWebMを保持（MP3変換/WebM保存用）

        // DOM
        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const relockBtn = document.getElementById('relockBtn');
        const timerDisplay = document.getElementById('timerDisplay');
        const sizeDisplay = document.getElementById('sizeDisplay');
        const meterFill = document.getElementById('meterFill');
        const recoverBtn = document.getElementById('recoverBtn');
        const downloadWebmBtn = document.getElementById('downloadWebmBtn');
        const recoveryBadge = document.getElementById('recoveryBadge');
        const convertStatus = document.getElementById('convertStatus');
        const ironOverlay = document.getElementById('ironOverlay');
        const driveStatus = document.getElementById('driveStatus');
        const driveSignInBtn = document.getElementById('driveSignInBtn');
        const driveUploadBtn = document.getElementById('driveUploadBtn');
        const driveAutoUpload = document.getElementById('driveAutoUpload');
        const driveMsg = document.getElementById('driveMsg');

        let audioContext = null;
        let analyser = null;
        let source = null;

        // -------------------- IndexedDB --------------------
        const DB_NAME = 'IronRecorderDB';
        const STORE_NAME = 'audioChunks';
        const DB_VERSION = 1;

        function openDatabase() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };
                request.onupgradeneeded = (ev) => {
                    const db = ev.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        const store = db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                        store.createIndex('sessionId', 'sessionId', { unique: false });
                        store.createIndex('timestamp', 'timestamp', { unique: false });
                    }
                };
            });
        }

        async function checkForPendingSession() {
            if (!db) await openDatabase();
            const tx = db.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const index = store.index('sessionId');
            const sessions = new Set();
            const request = index.openCursor();
            return new Promise((resolve) => {
                request.onsuccess = (ev) => {
                    const cursor = ev.target.result;
                    if (cursor) {
                        sessions.add(cursor.value.sessionId);
                        cursor.continue();
                    } else {
                        const sessionList = Array.from(sessions);
                        if (sessionList.length > 0) {
                            const lastSession = sessionList.sort().reverse()[0];
                            recoveryBadge.textContent = `🔴 中断データ有 (${lastSession.slice(0,8)})`;
                            recoverBtn.disabled = false;
                            downloadWebmBtn.disabled = false;
                        } else {
                            recoveryBadge.textContent = `待機中`;
                            recoverBtn.disabled = true;
                            downloadWebmBtn.disabled = true;
                        }
                        resolve();
                    }
                };
                request.onerror = () => resolve();
            });
        }

        async function saveChunkToDB(blob, sessionId, timestamp) {
            if (!db) await openDatabase();
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const record = { sessionId, timestamp, blob, size: blob.size };
            store.add(record);
            totalSavedBytes += blob.size;
            updateSizeDisplay();
            return new Promise((resolve, reject) => {
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e.target.error);
            });
        }

        async function getChunksBySession(sessionId) {
            if (!db) await openDatabase();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const index = store.index('sessionId');
                const request = index.getAll(sessionId);
                request.onsuccess = () => {
                    const records = request.result;
                    records.sort((a,b) => a.timestamp - b.timestamp);
                    resolve(records);
                };
                request.onerror = () => reject(request.error);
            });
        }

        async function deleteSessionData(sessionId) {
            if (!db) await openDatabase();
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const index = store.index('sessionId');
            const request = index.openCursor(IDBKeyRange.only(sessionId));
            return new Promise((resolve, reject) => {
                request.onsuccess = (ev) => {
                    const cursor = ev.target.result;
                    if (cursor) {
                        cursor.delete();
                        cursor.continue();
                    } else resolve();
                };
                request.onerror = () => reject(request.error);
            });
        }

        // -------------------- Wake Lock --------------------
        async function requestWakeLock() {
            if (!('wakeLock' in navigator)) return;
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => console.log('Wake Lock 解放'));
                document.addEventListener('visibilitychange', handleVisibilityChange);
            } catch (err) {}
        }

        async function releaseWakeLock() {
            if (wakeLock) {
                await wakeLock.release();
                wakeLock = null;
            }
            document.removeEventListener('visibilitychange', handleVisibilityChange);
        }

        async function handleVisibilityChange() {
            if (wakeLock !== null && document.visibilityState === 'visible' && isRecording) {
                await requestWakeLock();
            }
        }

        // -------------------- レベルメーター --------------------
        async function setupAudioMeter(stream) {
            if (audioContext) await audioContext.close();
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            source = audioContext.createMediaStreamSource(stream);
            source.connect(analyser);
        }

        function updateMeter() {
            if (!analyser) return;
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            const avg = sum / dataArray.length;
            const percent = Math.min(100, (avg / 255) * 150);
            meterFill.style.width = percent + '%';
            meterFill.style.background = percent > 80 ? 
                'linear-gradient(90deg, #b09060, #c07050)' : 
                'linear-gradient(90deg, #5f9f7f, #7fc07f)';
        }

        // -------------------- 表示 --------------------
        function formatTime(ms) {
            const totalSec = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSec / 60);
            const seconds = totalSec % 60;
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            else if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            else return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        function updateTimerAndSize() {
            if (isRecording && recordingStartTime) {
                timerDisplay.textContent = formatTime(Date.now() - recordingStartTime);
            } else {
                timerDisplay.textContent = '00:00';
            }
            updateSizeDisplay();
        }

        function updateSizeDisplay() {
            sizeDisplay.textContent = formatSize(totalSavedBytes);
        }

        // -------------------- アイアンスクリーン --------------------
        let longPressTimer = null;
        const LONG_PRESS_DURATION = 3000;

        function showIronOverlay() {
            if (ironOverlay.classList.contains('active')) return;
            ironOverlay.classList.add('active');
            bindIronEvents();
        }

        function hideIronOverlay() {
            if (!ironOverlay.classList.contains('active')) return;
            ironOverlay.classList.remove('active');
            unbindIronEvents();
            clearLongPressTimer();
        }

        function bindIronEvents() {
            ironOverlay.addEventListener('touchstart', onIronStart, { passive: false });
            ironOverlay.addEventListener('touchend', onIronEnd);
            ironOverlay.addEventListener('touchcancel', onIronCancel);
            ironOverlay.addEventListener('touchmove', preventAll, { passive: false });
            ironOverlay.addEventListener('mousedown', onIronStart);
            ironOverlay.addEventListener('mouseup', onIronEnd);
            ironOverlay.addEventListener('mouseleave', onIronCancel);
            ironOverlay.addEventListener('mousemove', preventAll);
            ironOverlay.addEventListener('click', preventAll, true);
            ironOverlay.addEventListener('contextmenu', preventAll);
        }

        function unbindIronEvents() {
            ironOverlay.removeEventListener('touchstart', onIronStart);
            ironOverlay.removeEventListener('touchend', onIronEnd);
            ironOverlay.removeEventListener('touchcancel', onIronCancel);
            ironOverlay.removeEventListener('touchmove', preventAll);
            ironOverlay.removeEventListener('mousedown', onIronStart);
            ironOverlay.removeEventListener('mouseup', onIronEnd);
            ironOverlay.removeEventListener('mouseleave', onIronCancel);
            ironOverlay.removeEventListener('mousemove', preventAll);
            ironOverlay.removeEventListener('click', preventAll, true);
            ironOverlay.removeEventListener('contextmenu', preventAll);
        }

        function preventAll(e) { e.preventDefault(); e.stopPropagation(); }
        function onIronStart(e) { preventAll(e); clearLongPressTimer(); longPressTimer = setTimeout(() => { hideIronOverlay(); clearLongPressTimer(); }, LONG_PRESS_DURATION); }
        function onIronEnd(e) { preventAll(e); clearLongPressTimer(); }
        function onIronCancel(e) { preventAll(e); clearLongPressTimer(); }
        function clearLongPressTimer() { if(longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } }

        // -------------------- WebM → MP3 変換 (lamejs) --------------------
        async function convertWebMToMp3(webmBlob) {
            convertStatus.textContent = 'MP3変換中... 少々お待ちください';
            // WebM → AudioBuffer
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const arrayBuffer = await webmBlob.arrayBuffer();
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            
            // モノラルに変換 (lamejsはモノラル/ステレオ対応)
            const channels = audioBuffer.numberOfChannels;
            const sampleRate = audioBuffer.sampleRate;
            const samples = audioBuffer.getChannelData(0); // 左チャンネルを使用
            
            // ステレオの場合は左右平均を取る (簡易)
            let pcmData;
            if (channels === 2) {
                const right = audioBuffer.getChannelData(1);
                pcmData = new Float32Array(samples.length);
                for (let i = 0; i < samples.length; i++) {
                    pcmData[i] = (samples[i] + right[i]) / 2;
                }
            } else {
                pcmData = samples;
            }

            // lamejs エンコード
            const mp3encoder = new lamejs.Mp3Encoder(1, sampleRate, 128); // モノラル, 128kbps
            const mp3Data = [];
            const blockSize = 1152;
            for (let i = 0; i < pcmData.length; i += blockSize) {
                const chunk = pcmData.subarray(i, i + blockSize);
                const int16 = new Int16Array(chunk.length);
                for (let j = 0; j < chunk.length; j++) {
                    let s = Math.max(-1, Math.min(1, chunk[j]));
                    int16[j] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                const mp3buf = mp3encoder.encodeBuffer(int16);
                if (mp3buf.length > 0) mp3Data.push(mp3buf);
            }
            const end = mp3encoder.flush();
            if (end.length > 0) mp3Data.push(end);
            
            const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
            convertStatus.textContent = 'MP3変換完了';
            return mp3Blob;
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // -------------------- Google Drive --------------------
        // 使用するクライアント ID を取得（定数 → localStorage の順）
        function getClientId() {
            if (GOOGLE_CLIENT_ID && GOOGLE_CLIENT_ID.indexOf('.apps.googleusercontent.com') !== -1) {
                return GOOGLE_CLIENT_ID;
            }
            return localStorage.getItem('googleClientId') || '';
        }

        // GIS ライブラリの読み込みを待ってトークンクライアントを初期化
        function initTokenClient() {
            const clientId = getClientId();
            if (!clientId) return false;
            if (!(window.google && google.accounts && google.accounts.oauth2)) return false;
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: clientId,
                scope: GOOGLE_DRIVE_SCOPE,
                callback: (resp) => {
                    if (resp && resp.error) {
                        setDriveMsg('サインイン失敗: ' + (resp.error_description || resp.error));
                        pendingUpload = null;
                        return;
                    }
                    accessToken = resp.access_token;
                    setDriveConnected(true);
                    setDriveMsg('Google Drive に接続しました');
                    // サインインを起点に予約されたアップロードがあれば実行
                    if (pendingUpload) {
                        const p = pendingUpload;
                        pendingUpload = null;
                        uploadToDrive(p.blob, p.name);
                    }
                },
            });
            return true;
        }

        function setDriveConnected(connected) {
            if (connected) {
                driveStatus.textContent = '接続済み';
                driveStatus.classList.add('connected');
                driveSignInBtn.textContent = '🔓 サインアウト';
                driveUploadBtn.disabled = !lastMp3Blob;
            } else {
                driveStatus.textContent = '未接続';
                driveStatus.classList.remove('connected');
                driveSignInBtn.textContent = '🔑 サインイン';
                driveUploadBtn.disabled = true;
            }
        }

        function setDriveMsg(text) { driveMsg.textContent = text; }

        // サインイン（アクセストークンの取得）を要求
        function driveSignIn() {
            let clientId = getClientId();
            if (!clientId) {
                const entered = prompt(
                    'Google OAuth クライアント ID を入力してください\n' +
                    '(Google Cloud Console で作成した「ウェブアプリケーション」用の ID)\n' +
                    '例: 1234567890-abcdef.apps.googleusercontent.com'
                );
                if (!entered) return;
                if (entered.indexOf('.apps.googleusercontent.com') === -1) {
                    alert('クライアント ID の形式が正しくないようです。\n末尾が .apps.googleusercontent.com のものを入力してください。');
                    return;
                }
                localStorage.setItem('googleClientId', entered.trim());
                clientId = entered.trim();
            }
            if (!tokenClient) {
                if (!initTokenClient()) {
                    setDriveMsg('Google ライブラリを読み込み中です。数秒後に再度お試しください。');
                    return;
                }
            }
            setDriveMsg('Google アカウントを選択してください...');
            // 既に同意済みなら空、初回は同意画面を表示
            tokenClient.requestAccessToken({ prompt: accessToken ? '' : 'consent' });
        }

        // サインアウト（トークンの破棄）
        function driveSignOut() {
            if (accessToken && window.google && google.accounts && google.accounts.oauth2) {
                google.accounts.oauth2.revoke(accessToken, () => {});
            }
            accessToken = null;
            setDriveConnected(false);
            setDriveMsg('サインアウトしました');
        }

        // MP3(等)の Blob を Google Drive へマルチパートアップロード
        async function uploadToDrive(blob, filename) {
            if (!blob) { setDriveMsg('アップロードするファイルがありません'); return; }
            if (!accessToken) {
                // 未サインインなら、サインイン後に自動アップロード
                pendingUpload = { blob, name: filename };
                setDriveMsg('サインインしてからアップロードします...');
                driveSignIn();
                return;
            }
            try {
                driveUploadBtn.disabled = true;
                setDriveMsg(`「${filename}」を Drive にアップロード中...`);
                const metadata = { name: filename, mimeType: blob.type || 'audio/mp3' };
                const form = new FormData();
                form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                form.append('file', blob);
                const res = await fetch(
                    'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink',
                    {
                        method: 'POST',
                        headers: { Authorization: 'Bearer ' + accessToken },
                        body: form,
                    }
                );
                if (res.status === 401) {
                    // トークン失効 → 再取得してリトライ予約
                    accessToken = null;
                    setDriveConnected(false);
                    pendingUpload = { blob, name: filename };
                    setDriveMsg('セッションが切れました。再サインインします...');
                    driveSignIn();
                    return;
                }
                if (!res.ok) {
                    const errText = await res.text();
                    throw new Error(`HTTP ${res.status} ${errText}`);
                }
                const data = await res.json();
                setDriveMsg(`✅ Drive に保存しました: ${data.name}`);
                if (data.webViewLink) {
                    driveMsg.innerHTML = `✅ Drive に保存しました: ` +
                        `<a href="${data.webViewLink}" target="_blank" rel="noopener" style="color:#8ab0d0;">${data.name}</a>`;
                }
            } catch (e) {
                setDriveMsg('アップロード失敗: ' + e.message);
            } finally {
                driveUploadBtn.disabled = !(accessToken && lastMp3Blob);
            }
        }

        // 直近の MP3 を Drive アップロード対象として保持
        function setLastMp3(blob, name) {
            lastMp3Blob = blob;
            lastMp3Name = name;
            driveUploadBtn.disabled = !accessToken;  // サインイン済みなら押せる
        }

        // -------------------- 録音制御 --------------------
        async function startRecording() {
            if (isRecording) return;
            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                let mimeType = 'audio/webm;codecs=opus';
                if (!MediaRecorder.isTypeSupported(mimeType)) {
                    mimeType = 'audio/webm';
                    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = '';
                }
                mediaRecorder = new MediaRecorder(audioStream, { mimeType });

                currentSessionId = `session_${Date.now()}`;
                totalSavedBytes = 0;
                finalWebMBlob = null;
                updateSizeDisplay();
                mediaRecorder.start(5000);

                isRecording = true;
                recordingStartTime = Date.now();
                recordBtn.disabled = true;
                stopBtn.disabled = false;
                relockBtn.disabled = false;
                recoverBtn.disabled = true;
                downloadWebmBtn.disabled = true;

                await requestWakeLock();
                await setupAudioMeter(audioStream);
                updateInterval = setInterval(() => { updateTimerAndSize(); updateMeter(); }, 100);
                showIronOverlay();

                mediaRecorder.ondataavailable = async (event) => {
                    if (event.data && event.data.size > 0) {
                        await saveChunkToDB(event.data, currentSessionId, Date.now());
                        recoveryBadge.textContent = `🔴 録音中`;
                    }
                };
            } catch (err) {
                alert('マイクアクセスエラー: ' + err.message);
                resetUI();
            }
        }

        async function stopRecording() {
            if (!isRecording || !mediaRecorder || mediaRecorder.state === 'inactive') return;
            mediaRecorder.stop();
            
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
                audioStream = null;
            }
            if (audioContext) {
                await audioContext.close();
                audioContext = null;
                analyser = null;
            }
            await releaseWakeLock();
            if (updateInterval) clearInterval(updateInterval);
            isRecording = false;
            recordBtn.disabled = false;
            stopBtn.disabled = true;
            relockBtn.disabled = true;
            hideIronOverlay();

            // 全チャンクをDBから取得してWebMに結合
            try {
                const chunks = await getChunksBySession(currentSessionId);
                if (chunks.length === 0) return;
                const blobs = chunks.map(r => r.blob);
                finalWebMBlob = new Blob(blobs, { type: mediaRecorder.mimeType || 'audio/webm' });
                
                // MP3に変換してダウンロード
                const mp3Blob = await convertWebMToMp3(finalWebMBlob);
                const mp3Name = `recording_${currentSessionId}.mp3`;
                downloadBlob(mp3Blob, mp3Name);

                // Drive アップロード用に保持
                setLastMp3(mp3Blob, mp3Name);
                // 自動アップロードが有効なら Drive へ
                if (driveAutoUpload.checked) {
                    uploadToDrive(mp3Blob, mp3Name);
                }

                // 変換後、DBから削除
                await deleteSessionData(currentSessionId);
                totalSavedBytes = 0;
                updateSizeDisplay();
                recoveryBadge.textContent = `待機中`;
                recoverBtn.disabled = true;
                downloadWebmBtn.disabled = true;
                convertStatus.textContent = 'MP3で保存しました';
            } catch (e) {
                alert('MP3変換エラー: ' + e.message);
                convertStatus.textContent = '変換失敗。WebM保存ボタンをお試しください';
                // WebM保存ボタンを有効化
                downloadWebmBtn.disabled = false;
            }
            await checkForPendingSession();
        }

        // 中断データをMP3復元
        async function recoverLastSession() {
            if (!db) await openDatabase();
            const tx = db.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const index = store.index('sessionId');
            const sessions = new Set();
            const request = index.openCursor();
            return new Promise((resolve) => {
                request.onsuccess = async (ev) => {
                    const cursor = ev.target.result;
                    if (cursor) {
                        sessions.add(cursor.value.sessionId);
                        cursor.continue();
                    } else {
                        const sessionList = Array.from(sessions).sort().reverse();
                        if (sessionList.length === 0) { alert('復元可能なデータはありません。'); return resolve(); }
                        const lastSession = sessionList[0];
                        try {
                            const chunks = await getChunksBySession(lastSession);
                            const blobs = chunks.map(r => r.blob);
                            const webmBlob = new Blob(blobs, { type: 'audio/webm' });
                            const mp3Blob = await convertWebMToMp3(webmBlob);
                            const mp3Name = `recovered_${lastSession}.mp3`;
                            downloadBlob(mp3Blob, mp3Name);
                            setLastMp3(mp3Blob, mp3Name);
                            if (driveAutoUpload.checked) uploadToDrive(mp3Blob, mp3Name);
                            if (confirm('復元データを端末から削除しますか？')) {
                                await deleteSessionData(lastSession);
                            }
                            await checkForPendingSession();
                        } catch (e) { alert('復元失敗: ' + e.message); }
                        resolve();
                    }
                };
            });
        }

        async function downloadCurrentAsWebM() {
            if (finalWebMBlob) {
                downloadBlob(finalWebMBlob, `recording_${currentSessionId || 'session'}.webm`);
            } else {
                alert('WebMデータがありません');
            }
        }

        function resetUI() {
            isRecording = false;
            recordBtn.disabled = false;
            stopBtn.disabled = true;
            relockBtn.disabled = true;
            timerDisplay.textContent = '00:00';
            meterFill.style.width = '0%';
            hideIronOverlay();
            if (updateInterval) clearInterval(updateInterval);
        }

        // -------------------- イベント登録 --------------------
        recordBtn.addEventListener('click', startRecording);
        stopBtn.addEventListener('click', stopRecording);
        relockBtn.addEventListener('click', () => { if (isRecording) showIronOverlay(); });
        recoverBtn.addEventListener('click', async () => {
            if (isRecording) { alert('録音中は復元できません'); return; }
            await recoverLastSession();
        });
        downloadWebmBtn.addEventListener('click', downloadCurrentAsWebM);

        // Google Drive
        driveSignInBtn.addEventListener('click', () => {
            if (accessToken) driveSignOut();
            else driveSignIn();
        });
        driveUploadBtn.addEventListener('click', () => {
            if (!lastMp3Blob) { setDriveMsg('先に録音してMP3を作成してください'); return; }
            uploadToDrive(lastMp3Blob, lastMp3Name || 'recording.mp3');
        });
        driveAutoUpload.addEventListener('change', () => {
            localStorage.setItem('driveAutoUpload', driveAutoUpload.checked ? '1' : '0');
        });

        // GIS ライブラリの読み込みを待ってトークンクライアントを準備
        function waitForGisAndInit(retries) {
            if (initTokenClient()) return;               // クライアントID設定済みなら初期化
            if (window.google && google.accounts) return; // ライブラリは来たがIDは未設定（サインイン時に入力）
            if (retries > 0) setTimeout(() => waitForGisAndInit(retries - 1), 300);
        }

        window.addEventListener('load', async () => {
            try { await openDatabase(); await checkForPendingSession(); } catch (e) {}
            // 自動アップロード設定を復元
            if (localStorage.getItem('driveAutoUpload') === '1') driveAutoUpload.checked = true;
            // クライアントIDが未設定なら案内を表示
            if (!getClientId()) {
                setDriveMsg('サインインを押して OAuth クライアント ID を設定してください（初回のみ）');
            }
            waitForGisAndInit(20);
        });
        window.addEventListener('beforeunload', () => { if (wakeLock) wakeLock.release(); });
    })();
</script>
